[project]
name = "prototype-discord-chatbot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "taepyeong", email = "taepyeong.dev@gmail.com" }
]
dependencies = [
    "discord>=2.3.2",
    "python-dotenv>=1.1.1",
    "openai>=1.93.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prototype_discord_chatbot"]
